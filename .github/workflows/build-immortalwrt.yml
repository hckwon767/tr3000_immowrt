name: Build ImmortalWrt for CUDY TR3000 (SDK + ImageBuilder)

on:
  workflow_dispatch:

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: cudy_tr3000-v1
  DOWNLOAD_BASE: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: SDK로 커스텀 패키지만 컴파일 (alpha 테마)
  # OpenClash는 공식 사전 빌드 apk를 그대로 사용 (libffi 이슈 회피)
  # ──────────────────────────────────────────────
  build-custom-packages:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swift: true

      - name: Install Build Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk rsync gettext \
            git libncurses5-dev libssl-dev python3-distutils zlib1g-dev file wget \
            unzip python3-setuptools python3-pyelftools zstd jq

      - name: Resolve & Download SDK
        run: |
          curl -sL "${DOWNLOAD_BASE}/sha256sums" -o sha256sums
          SDK_FILE=$(grep -oE 'immortalwrt-sdk-mediatek-filogic[^ ]*\.tar\.zst' sha256sums | head -n1)
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          echo "Resolved SDK: $SDK_FILE"
          curl -L --retry 3 --fail "${DOWNLOAD_BASE}/${SDK_FILE}" -o sdk.tar.zst
          mkdir sdk && tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Add Custom Package Sources
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Alpha 테마 + 필수 종속 패키지
          rm -rf package/luci-theme-alpha package/luci-app-alpha-config
          git clone --depth 1 https://github.com/derisamedia/luci-theme-alpha package/luci-theme-alpha
          git clone --depth 1 https://github.com/animegasan/luci-app-alpha-config package/luci-app-alpha-config

          # brand.png 교체 (상단바 + 로그인화면)
          curl -L --retry 3 --fail \
            "https://raw.githubusercontent.com/hckwon767/tr3000_immowrt/refs/heads/main/brand.png" \
            -o /tmp/brand.png
          cp /tmp/brand.png package/luci-theme-alpha/luasrc/brand.png
          cp /tmp/brand.png package/luci-theme-alpha/luasrc/style/brand.png

      - name: Compile Custom Packages Only (alpha 테마만)
        run: |
          cd sdk
          make defconfig
          make package/luci-theme-alpha/compile V=s -j$(nproc)
          make package/luci-app-alpha-config/compile V=s -j$(nproc)

      - name: Download Official Prebuilt OpenClash (공식 apk, SDK 빌드 우회)
        run: |
          mkdir -p /tmp/custom-packages
          curl -sL --retry 2 "https://api.github.com/repos/vernesong/OpenClash/releases/latest" \
            -o /tmp/openclash_release.json

          DOWNLOAD_URL=$(jq -r '.assets[].browser_download_url' /tmp/openclash_release.json | grep '\.apk$' | head -n1)

          if [ -n "$DOWNLOAD_URL" ]; then
            FILENAME=$(basename "$DOWNLOAD_URL")
            echo "Resolved OpenClash URL: $DOWNLOAD_URL"
            echo "Saving as: $FILENAME"
            curl -L --retry 3 --fail -o "/tmp/custom-packages/${FILENAME}" "$DOWNLOAD_URL"
          else
            echo "::error::OpenClash apk 릴리즈를 찾지 못했습니다"
            exit 1
          fi

      - name: Collect Built Packages
        run: |
          find sdk/bin/packages -type f \( -name "*.apk" -o -name "*.ipk" \) \
            -iname "*alpha*" \
            -exec cp -v {} /tmp/custom-packages/ \;
          ls -la /tmp/custom-packages/
          tar -czf custom-packages.tar.gz -C /tmp custom-packages

      - name: Upload Custom Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-packages
          path: custom-packages.tar.gz
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2: ImageBuilder로 최종 이미지 조립
  # ──────────────────────────────────────────────
  build-image:
    needs: build-custom-packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk file wget unzip python3 zstd curl

      - name: Download Custom Packages Artifact
        uses: actions/download-artifact@v4
        with:
          name: custom-packages

      - name: Extract Custom Packages
        run: |
          tar -xzf custom-packages.tar.gz

      - name: Resolve & Download ImageBuilder
        run: |
          curl -sL "${DOWNLOAD_BASE}/sha256sums" -o sha256sums
          IB_FILE=$(grep -oE 'immortalwrt-imagebuilder-mediatek-filogic[^ ]*\.tar\.zst' sha256sums | head -n1)
          echo "IB_FILE=$IB_FILE" >> $GITHUB_ENV
          echo "Resolved ImageBuilder: $IB_FILE"
          curl -L --retry 3 --fail "${DOWNLOAD_BASE}/${IB_FILE}" -o imagebuilder.tar.zst
          mkdir imagebuilder && tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: Register Custom Package Repo
        run: |
          cd imagebuilder
          mkdir -p custom-repo keys
          cp ../custom-packages/*.apk custom-repo/
          echo "── 커스텀 패키지 목록 ──"
          ls -la custom-repo/

          APK_BIN=$(find "$(pwd)" -maxdepth 5 -type f -name apk -perm -u+x 2>/dev/null | head -n1)
          echo "Resolved apk binary path: ${APK_BIN:-NOT FOUND}"
          if [ -z "$APK_BIN" ]; then
            echo "::error::apk 바이너리를 못 찾았습니다"
            exit 1
          fi

          openssl ecparam -name prime256v1 -genkey -noout -out custom.sec
          openssl ec -in custom.sec -pubout -out custom.pub
          cp custom.pub keys/custom-repo.pub

          (cd custom-repo && "$APK_BIN" mkndx --allow-untrusted --sign "$(pwd)/../custom.sec" --output packages.adb *.apk)

          echo "file://$(pwd)/custom-repo/packages.adb" >> repositories
          echo "── 최종 repositories ──"
          cat repositories
          echo "── keys 디렉토리 ──"
          ls -la keys/

      - name: Prepare Custom Files Overlay
        run: |
          mkdir -p imagebuilder/files/etc/uci-defaults
          mkdir -p imagebuilder/files/etc/openclash/core

          # UCI 기본값 설정
          cat << 'EOF' > imagebuilder/files/etc/uci-defaults/99-custom
          uci set system.@system[0].hostname='CUDY_VPNBOX'
          uci set luci.main.lang='ko'
          uci set luci.main.mediaurlbase='/luci-static/alpha'
          uci commit luci

          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='1'
          uci commit firewall

          # zashboard만 사용하므로 OpenClash 기본 번들 UI(metacubexd)는 첫 부팅 시 제거
          rm -rf /usr/share/openclash/ui/metacubexd
          exit 0
          EOF
          chmod +x imagebuilder/files/etc/uci-defaults/99-custom

          # OpenClash Smart Core 사전 내장
          curl -L --retry 3 --fail \
            "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/smart/clash-linux-arm64.tar.gz" \
            -o /tmp/clash-arm64.tar.gz
          tar -xzf /tmp/clash-arm64.tar.gz -C /tmp
          cp /tmp/clash imagebuilder/files/etc/openclash/core/clash_meta
          chmod +x imagebuilder/files/etc/openclash/core/clash_meta

          # zashboard 한국어 패치
          mkdir -p imagebuilder/files/usr/share/openclash/ui/zashboard
          curl -L --retry 3 --fail \
            "https://github.com/hckwon767/dashboard-ko/releases/download/v3.15.0/zashboard-ko.zip" \
            -o /tmp/zashboard-ko.zip
          unzip -q /tmp/zashboard-ko.zip -d /tmp/dashboard-ko-extract
          cp -a /tmp/dashboard-ko-extract/. imagebuilder/files/usr/share/openclash/ui/zashboard/ 2>/dev/null || true

      - name: Build Image
        run: |
          cd imagebuilder
          make image PROFILE="${PROFILE}" \
            PACKAGES="\
              luci luci-base \
              luci-theme-alpha luci-app-alpha-config \
              default-settings-chn \
              luci-i18n-base-ko \
              luci-i18n-attendedsysupgrade-ko luci-i18n-dashboard-ko luci-i18n-ddns-ko \
              luci-app-package-manager luci-i18n-package-manager-ko \
              luci-mod-dashboard luci-app-ttyd luci-app-attendedsysupgrade \
              luci-app-upnp luci-app-sqm htop nano irqbalance \
              luci-app-ddns ddns-scripts \
              luci-app-openclash kmod-tun ruby ruby-yaml ruby-psych ruby-pstore \
              kmod-inet-diag unzip luci-compat \
              -dnsmasq dnsmasq-full \
              coreutils coreutils-nohup bash curl wget-ssl ca-certificates ca-bundle \
              ipset ip-full iptables iptables-nft iptables-mod-tproxy iptables-mod-extra \
              kmod-ipt-tproxy kmod-nft-tproxy jq jsonfilter \
              lm-sensors collectd-mod-sensors collectd \
              kmod-nft-offload \
              zram-swap \
              ethtool \
            " \
            FILES="files" \
            EXTRA_IMAGE_NAME="ko-custom"

      - name: Prepare Artifacts for Release
        id: organize
        run: |
          cd imagebuilder/bin/targets/mediatek/filogic
          mkdir -p /tmp/release_files
          cp -a *sysupgrade.bin /tmp/release_files/ 2>/dev/null || true
          cp -a *factory.bin /tmp/release_files/ 2>/dev/null || true
          cp -a *initramfs*.bin /tmp/release_files/ 2>/dev/null || true
          cp -a *initramfs*.kernel /tmp/release_files/ 2>/dev/null || true
          cp -a *.manifest /tmp/release_files/ 2>/dev/null || true
          cp -a sha256sums /tmp/release_files/ 2>/dev/null || true

          TAG_NAME="ImmortalWrt-CUDY-TR3000-V1-$(date +'%Y.%m.%d-%H%M')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_PATH=/tmp/release_files" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ImmortalWrt Release ${{ env.TAG_NAME }}
          files: ${{ steps.organize.outputs.RELEASE_PATH }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
